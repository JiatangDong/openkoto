name: Build PDF Translation Sidecar

on:
  push:
    tags:
      - 'pdf-translator-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: win-x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: textlingo-desktop/pdf-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build executable
        working-directory: textlingo-desktop/pdf-sidecar
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkoto-pdf-translator-${{ matrix.platform }}
          path: textlingo-desktop/pdf-sidecar/dist/openkoto-pdf-translator-*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: PDF Translation Sidecar ${{ github.ref_name }}
          body: |
            ## OpenKoto PDF Translation Sidecar
            
            下载适合您系统的版本：
            - **Windows**: `openkoto-pdf-translator-win-x64.exe`
            - **macOS (Intel)**: `openkoto-pdf-translator-macos-x64`
            - **macOS (Apple Silicon)**: `openkoto-pdf-translator-macos-arm64`
            - **Linux**: `openkoto-pdf-translator-linux-x64`
            
            ### 使用方法
            1. 该产物供 OpenKoto Desktop 内置 PDF sidecar 使用
            2. 发布流程可将其复制到桌面应用打包所需的二进制目录
            
          files: dist/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: textlingo-desktop/package-lock.json

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./textlingo-desktop

      - name: Download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Prepare frontend dist for Tauri context
        run: mkdir -p textlingo-desktop/dist

      - name: Rust tests
        run: cargo test --all-features --all-targets
        working-directory: ./textlingo-desktop/src-tauri

      - name: Frontend coverage gate (>=80%)
        run: npm run coverage
        working-directory: ./textlingo-desktop

  publish-tauri:
    needs: ci-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg


      - name: install frontend dependencies
        run: npm install
        working-directory: ./textlingo-desktop

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenKoto Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## Release Highlights
            - Added GFM table rendering support for AI chat replies and analysis outputs.
            - Unified AI Markdown rendering so assistant responses now share the same table, list, and code formatting.
            - Improved narrow-screen table behavior with touch-friendly horizontal scrolling and better column wrapping.

            ## Changed
            - Agent replies, article chat replies, explanation notes, and analysis results now use the shared Markdown renderer.
            - Desktop version is bumped to `${{ github.ref_name }}` for this release.
            - Multi-platform GitHub release publishing remains tag-driven through this workflow.
          releaseDraft: false
          prerelease: false
          projectPath: "./textlingo-desktop"
          args: ${{ matrix.args }}

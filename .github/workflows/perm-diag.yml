name: perm-diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== try create release with GITHUB_TOKEN =="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hikariming/openkoto/releases \
            -d '{"tag_name":"perm-diag-delete-me","draft":true,"name":"diag"}' | tail -3
